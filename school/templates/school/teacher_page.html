<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Панель Вчителя | School System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    {% csrf_token %}

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">SchoolPerformanceSystem</a>
            <span class="navbar-text text-white-50">Панель викладача</span>
        </div>
    </nav>

    <div class="container">
        <div id="homeroom-section" class="card shadow-sm mb-5 d-none">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">📊 Панель класного керівника (<span id="homeroom-class-name">...</span>)</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Зведена інформація про успішність учнів вашого класу з усіх предметів.</p>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ПІБ Учня</th>
                                <th class="text-center">Кількість оцінок</th>
                                <th class="text-center">Середній бал класу</th>
                            </tr>
                        </thead>
                        <tbody id="homeroom-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>📚 Мої предмети та класи</h3>
            <input type="text" id="searchCards" class="form-control w-25" placeholder="🔍 Пошук класу або предмета...">
        </div>

        <div id="alert-container"></div>
        <div class="row" id="assignments-container"></div>
    </div>

    <div class="modal fade" id="gradeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Виставити оцінку</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="gradeForm">
                        <input type="hidden" id="currentAssignmentId">

                        <div class="mb-3">
                            <label class="form-label">Учень</label>
                            <select id="studentSelect" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Семестр</label>
                            <select id="semesterSelect" class="form-select" required></select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Тип запису</label>
                                <select id="gradeType" class="form-select">
                                    <option value="Оцінка">Оцінка (1-12)</option>
                                    <option value="Н/Б">Не був (Н/Б)</option>
                                    <option value="Зв.">Звільнений (Зв.)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Бал</label>
                                <input type="number" id="gradeValue" class="form-control" min="1" max="12">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата проведення заняття</label>
                            <input type="date" id="gradeDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Коментар (необов'язково)</label>
                            <textarea id="gradeComment" class="form-control" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зберегти оцінку</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let gradeModal;
        let allAssignments = [];

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.addEventListener('DOMContentLoaded', function() {
            gradeModal = new bootstrap.Modal(document.getElementById('gradeModal'));
            document.getElementById('gradeDate').valueAsDate = new Date();

            // 1. Завантаження основних предметів вчителя
            fetch('/api/teacher/dashboard/')
                .then(response => response.json())
                .then(data => {
                    allAssignments = data.assignments;
                    renderAssignments(allAssignments);
                });

            // 2. Спроба завантажити дані класного керівника
            fetch('/api/homeroom/dashboard/')
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Not a homeroom teacher');
                })
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('homeroom-section').classList.remove('d-none');
                        document.getElementById('homeroom-class-name').textContent = data.class_name;

                        const tbody = document.getElementById('homeroom-table-body');
                        tbody.innerHTML = data.students.map(s => `
                            <tr>
                                <td><strong>${s.student_name}</strong></td>
                                <td class="text-center">${s.total_grades_count}</td>
                                <td class="text-center">
                                    <span class="badge ${s.average_score >= 10 ? 'bg-success' : s.average_score >= 7 ? 'bg-primary' : 'bg-warning'} fs-6">
                                        ${s.average_score}
                                    </span>
                                </td>
                            </tr>
                        `).join('');
                    }
                })
                .catch(err => console.log("Користувач не є класним керівником. Секцію приховано."));

            // Пошук по картках предметів
            document.getElementById('searchCards').addEventListener('input', function(e) {
                const term = e.target.value.toLowerCase();
                const filtered = allAssignments.filter(a =>
                    a.subject.toLowerCase().includes(term) || a.class.toLowerCase().includes(term)
                );
                renderAssignments(filtered);
            });

            document.getElementById('gradeForm').addEventListener('submit', submitGrade);
        });

        function renderAssignments(assignments) {
            const container = document.getElementById('assignments-container');
            container.innerHTML = '';

            assignments.forEach(a => {
                container.insertAdjacentHTML('beforeend', `
                <div class="col-md-4 mb-3">
                    <div class="card h-100 shadow-sm border-primary border-top border-3">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-primary">${a.subject}</h5>
                            <h6 class="card-subtitle mb-4 text-muted">Клас: ${a.class}</h6>

                            <div class="mt-auto">
                                <button class="btn btn-primary btn-sm w-100 mb-2" onclick="openJournal(${a.assignment_id})">
                                    📝 Відкрити журнал / Оцінити
                                </button>
                                <a href="/api/teacher/assignment/${a.assignment_id}/export/" class="btn btn-outline-success btn-sm w-100">
                                    📥 Завантажити звіт CSV
                                </a>
                            </div>
                        </div>
                    </div>
                </div>`);
            });
        }

        function openJournal(assignmentId) {
            document.getElementById('currentAssignmentId').value = assignmentId;

            fetch(`/api/teacher/assignment/${assignmentId}/journal-data/`)
                .then(res => res.json())
                .then(data => {
                    const studSelect = document.getElementById('studentSelect');
                    const semSelect = document.getElementById('semesterSelect');

                    studSelect.innerHTML = data.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                    semSelect.innerHTML = data.semesters.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

                    gradeModal.show();
                });
        }

        function submitGrade(e) {
            e.preventDefault();

            const assignId = document.getElementById('currentAssignmentId').value;
            const studentId = document.getElementById('studentSelect').value;
            const semId = document.getElementById('semesterSelect').value;

            const payload = {
                value: document.getElementById('gradeValue').value || null,
                grade_type: document.getElementById('gradeType').value,
                grade_date: document.getElementById('gradeDate').value,
                comment: document.getElementById('gradeComment').value
            };

            fetch(`/api/teacher/assignment/${assignId}/student/${studentId}/semester/${semId}/grade/add/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    gradeModal.hide();
                    document.getElementById('gradeForm').reset();
                    document.getElementById('gradeDate').valueAsDate = new Date();

                    document.getElementById('alert-container').innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show">
                            ${data.message}. Будь ласка, перезавантажте сторінку для оновлення звітів керівника.
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>`;
                } else {
                    alert('Помилка: ' + JSON.stringify(data.errors));
                }
            });
        }
    </script>
</body>
</html>
