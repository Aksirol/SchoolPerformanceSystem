<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Панель Вчителя | School System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        th.sortable:hover { background-color: #495057; }
        th.sortable::after { content: ' ⇅'; opacity: 0.4; font-size: .8em; }
        th.sortable.asc::after  { content: ' ↑'; opacity: 1; }
        th.sortable.desc::after { content: ' ↓'; opacity: 1; }
    </style>
</head>
<body class="bg-light">
    {% csrf_token %}

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">SchoolPerformanceSystem</a>
            <span class="navbar-text text-white-50 me-auto ms-3">Панель викладача</span>
            <span class="navbar-text text-white-50 me-3" id="nav-username"></span>
            <form method="post" action="/accounts/logout/" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Вийти</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <!-- Панель класного керівника (показується лише якщо є клас) -->
        <div id="homeroom-section" class="card shadow-sm mb-5 d-none">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">📊 Панель класного керівника (<span id="homeroom-class-name">...</span>)</h4>
            </div>
            <div class="card-body">
                <p class="text-muted mb-3">Зведена інформація про успішність учнів вашого класу з усіх предметів.</p>

                <div class="row mb-3 align-items-center">
                    <div class="col-md-4">
                        <input type="text" id="homeroomSearch" class="form-control form-control-sm"
                               placeholder="🔍 Пошук за прізвищем...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th class="sortable" data-col="name">ПІБ Учня</th>
                                <th class="sortable text-center" data-col="count">Кількість оцінок</th>
                                <th class="sortable text-center" data-col="avg">Середній бал</th>
                            </tr>
                        </thead>
                        <tbody id="homeroom-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Мої предмети -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>📚 Мої предмети та класи</h3>
            <input type="text" id="searchCards" class="form-control w-25"
                   placeholder="🔍 Пошук класу або предмета...">
        </div>

        <div id="alert-container"></div>
        <div class="row" id="assignments-container"></div>
    </div>

    <!-- Модальне вікно оцінки -->
    <div class="modal fade" id="gradeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Виставити оцінку</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="gradeForm">
                        <input type="hidden" id="currentAssignmentId">
                        <div class="mb-3">
                            <label class="form-label">Учень</label>
                            <select id="studentSelect" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Семестр</label>
                            <select id="semesterSelect" class="form-select" required></select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Тип запису</label>
                                <select id="gradeType" class="form-select">
                                    <option value="Оцінка">Оцінка (1–12)</option>
                                    <option value="Н/Б">Не був (Н/Б)</option>
                                    <option value="Зв.">Звільнений (Зв.)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Бал</label>
                                <input type="number" id="gradeValue" class="form-control" min="1" max="12">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата</label>
                            <input type="date" id="gradeDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Коментар (необов'язково)</label>
                            <textarea id="gradeComment" class="form-control" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зберегти оцінку</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let gradeModal;
        let allAssignments = [];
        let homeroomStudents = [];
        let homeroomSort = { col: 'name', dir: 'asc' };

        function getCookie(name) {
            let v = null;
            if (document.cookie) {
                document.cookie.split(';').forEach(c => {
                    c = c.trim();
                    if (c.startsWith(name + '=')) v = decodeURIComponent(c.slice(name.length + 1));
                });
            }
            return v;
        }

        // --- Сортування таблиці класного керівника ---
        function renderHomeroomTable() {
            const q = document.getElementById('homeroomSearch').value.toLowerCase();
            let rows = homeroomStudents.filter(s => s.student_name.toLowerCase().includes(q));

            rows.sort((a, b) => {
                let va, vb;
                if (homeroomSort.col === 'name') {
                    va = a.student_name; vb = b.student_name;
                    return homeroomSort.dir === 'asc' ? va.localeCompare(vb, 'uk') : vb.localeCompare(va, 'uk');
                }
                if (homeroomSort.col === 'count') { va = a.total_grades_count; vb = b.total_grades_count; }
                if (homeroomSort.col === 'avg')   { va = parseFloat(a.average_score) || 0; vb = parseFloat(b.average_score) || 0; }
                return homeroomSort.dir === 'asc' ? va - vb : vb - va;
            });

            const tbody = document.getElementById('homeroom-table-body');
            tbody.innerHTML = rows.length === 0
                ? '<tr><td colspan="3" class="text-center text-muted">Нічого не знайдено</td></tr>'
                : rows.map(s => {
                    const avg = parseFloat(s.average_score) || 0;
                    const badge = avg >= 10 ? 'bg-success' : avg >= 7 ? 'bg-primary' : 'bg-warning';
                    return `<tr>
                        <td><strong>${s.student_name}</strong></td>
                        <td class="text-center">${s.total_grades_count}</td>
                        <td class="text-center">
                            <span class="badge ${badge} fs-6">${s.average_score}</span>
                        </td>
                    </tr>`;
                }).join('');
        }

        document.addEventListener('DOMContentLoaded', function () {
            gradeModal = new bootstrap.Modal(document.getElementById('gradeModal'));
            document.getElementById('gradeDate').valueAsDate = new Date();

            // Заголовки таблиці класного керівника — обробники кліків
            document.querySelectorAll('#homeroom-section th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const col = th.dataset.col;
                    if (homeroomSort.col === col) {
                        homeroomSort.dir = homeroomSort.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        homeroomSort = { col, dir: 'asc' };
                    }
                    document.querySelectorAll('#homeroom-section th.sortable').forEach(h => {
                        h.classList.remove('asc', 'desc');
                    });
                    th.classList.add(homeroomSort.dir);
                    renderHomeroomTable();
                });
            });

            document.getElementById('homeroomSearch').addEventListener('input', renderHomeroomTable);

            // Завантаження предметів вчителя
            fetch('/api/teacher/dashboard/')
                .then(r => r.json())
                .then(data => {
                    allAssignments = data.assignments;
                    renderAssignments(allAssignments);
                });

            // Завантаження даних класного керівника (якщо є)
            fetch('/api/homeroom/dashboard/')
                .then(r => { if (r.ok) return r.json(); throw new Error(); })
                .then(data => {
                    if (data.status !== 'success') return;
                    document.getElementById('homeroom-section').classList.remove('d-none');
                    document.getElementById('homeroom-class-name').textContent = data.class_name;
                    homeroomStudents = data.students;
                    renderHomeroomTable();
                })
                .catch(() => {});

            document.getElementById('searchCards').addEventListener('input', e => {
                const term = e.target.value.toLowerCase();
                renderAssignments(allAssignments.filter(a =>
                    a.subject.toLowerCase().includes(term) || a.class.toLowerCase().includes(term)
                ));
            });

            document.getElementById('gradeForm').addEventListener('submit', submitGrade);
        });

        function renderAssignments(assignments) {
            const container = document.getElementById('assignments-container');
            container.innerHTML = '';
            assignments.forEach(a => {
                container.insertAdjacentHTML('beforeend', `
                <div class="col-md-4 mb-3">
                    <div class="card h-100 shadow-sm border-primary border-top border-3">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-primary">${a.subject}</h5>
                            <h6 class="card-subtitle mb-4 text-muted">Клас: ${a.class}</h6>
                            <div class="mt-auto">
                                <button class="btn btn-primary btn-sm w-100 mb-2"
                                        onclick="openJournal(${a.assignment_id})">
                                    📝 Відкрити журнал / Оцінити
                                </button>
                                <a href="/api/teacher/assignment/${a.assignment_id}/export/"
                                   class="btn btn-outline-success btn-sm w-100">
                                    📥 Завантажити звіт CSV
                                </a>
                            </div>
                        </div>
                    </div>
                </div>`);
            });
        }

        function openJournal(assignmentId) {
            document.getElementById('currentAssignmentId').value = assignmentId;
            fetch(`/api/teacher/assignment/${assignmentId}/journal-data/`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('studentSelect').innerHTML =
                        data.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                    document.getElementById('semesterSelect').innerHTML =
                        data.semesters.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                    gradeModal.show();
                });
        }

        function submitGrade(e) {
            e.preventDefault();
            const assignId  = document.getElementById('currentAssignmentId').value;
            const studentId = document.getElementById('studentSelect').value;
            const semId     = document.getElementById('semesterSelect').value;
            const payload   = {
                value:      document.getElementById('gradeValue').value || null,
                grade_type: document.getElementById('gradeType').value,
                grade_date: document.getElementById('gradeDate').value,
                comment:    document.getElementById('gradeComment').value,
            };

            fetch(`/api/teacher/assignment/${assignId}/student/${studentId}/semester/${semId}/grade/add/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify(payload),
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    gradeModal.hide();
                    document.getElementById('gradeForm').reset();
                    document.getElementById('gradeDate').valueAsDate = new Date();
                    document.getElementById('alert-container').innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show">
                            ${data.message}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>`;
                } else {
                    alert('Помилка: ' + JSON.stringify(data.errors));
                }
            });
        }
    </script>
</body>
</html>
